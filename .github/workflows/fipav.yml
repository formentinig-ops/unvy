name: Aggiorna dati FIPAV

on:
  schedule:
    # orari in UTC (Italia = UTC+1 d'inverno, UTC+2 d'estate)
    - cron: "7 * * * *"              # ogni ora, tutti i giorni
    - cron: "*/15 13-23 * * 5,6"     # venerdì e sabato dal pomeriggio a mezzanotte: ogni 15 minuti
    - cron: "*/15 18-23 * * 3,4"     # mercoledì e giovedì sera (anticipi): ogni 15 minuti
    - cron: "*/15 13-21 * * 0"       # domenica pomeriggio: ogni 15 minuti
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fipav
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leggi il portale FIPAV
        run: python3 scripts/fipav_sync.py
      - name: Salva se ci sono novità
        run: |
          if git diff --quiet data/fipav.json; then
            echo "Nessuna novità"
            exit 0
          fi
          git config user.name "unvy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fipav.json
          git commit -m "Dati FIPAV aggiornati"
          git pull --rebase -q
          git push
